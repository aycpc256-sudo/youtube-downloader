<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Downloader"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <title>
    개인용 Downloader
  </title>

</head>


<body>

<main class="app">

  <header class="header">

    <h1>
      개인용 Downloader
    </h1>

    <p
      class="subtitle"
      id="device-label"
    >
      기기 확인 중...
    </p>

  </header>


  <!-- URL -->

  <section class="card">

    <label
      class="label"
      for="url"
    >
      YouTube URL
    </label>

    <input
      id="url"
      type="url"
      inputmode="url"
      autocomplete="off"
      placeholder="https://youtu.be/..."
    >

  </section>


  <!-- 형식 -->

  <section class="card">

    <div class="label">
      다운로드 형식
    </div>

    <div class="row">

      <button
        class="chip active"
        type="button"
        data-format="mp3"
      >
        MP3
      </button>

      <button
        class="chip"
        type="button"
        data-format="m4a"
      >
        M4A
      </button>

      <button
        class="chip"
        type="button"
        data-format="mp4"
      >
        MP4
      </button>

    </div>


    <div
      class="label quality-label"
    >

      품질

      <span
        id="quality-hint"
        class="hint"
      >
        MP3 음질
      </span>

    </div>


    <select
      id="quality"
    >
    </select>


    <div
      id="video-info"
      class="video-info"
    >
    </div>

  </section>


  <!-- 다운로드 -->

  <section class="card">

    <button
      id="download-btn"
      class="primary"
      type="button"
    >
      다운로드
    </button>


    <button
      id="cancel-btn"
      class="secondary"
      type="button"
      disabled
    >
      취소
    </button>


    <div
      class="progress-wrap"
    >

      <div
        id="progress-bar"
        class="progress-bar"
      ></div>

    </div>


    <p
      id="status"
      class="status"
    ></p>

  </section>


  <!-- 진단 -->

  <section class="card">

    <div class="row between">

      <div>

        <div class="label">
          서버 진단
        </div>

        <div class="hint">
          YouTube client / Deno / FFmpeg / PO Token
        </div>

      </div>

      <button
        id="diagnose-btn"
        class="ghost"
        type="button"
      >
        진단
      </button>

    </div>


    <pre
      id="diagnose-result"
      class="diagnose-result"
    ></pre>

  </section>


  <footer class="footer">

    개인용 웹 Downloader

  </footer>

</main>


<script src="app.js"></script>

</body>

</html>
