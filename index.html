<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>개인용 YouTube Downloader</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .page-nav { display:flex; gap:8px; margin-bottom:14px; }
    .page-nav a {
      display:inline-block; padding:9px 13px; border-radius:10px;
      background:#222; color:#fff; text-decoration:none; font-size:14px;
    }
    .page-nav a.active { background:#444; }
  </style>
</head>

<body>
<main class="app">

  <div class="page-nav">
    <a class="active" href="index.html">Downloader</a>
    <a href="diagnostic.html">서버 진단</a>
  </div>

  <header class="header">
    <h1>개인용 Downloader</h1>
    <p id="device-label" class="subtitle">기기 확인 중...</p>
  </header>

  <section class="card">
    <label for="url" class="label">YouTube URL</label>
    <input
      id="url"
      type="url"
      inputmode="url"
      autocomplete="off"
      placeholder="https://youtu.be/..."
    />
  </section>

  <section class="card">
    <div class="label">다운로드 형식</div>
    <div class="row">
      <button class="chip active" data-format="mp3" type="button">MP3</button>
      <button class="chip" data-format="m4a" type="button">M4A</button>
      <button class="chip" data-format="mp4" type="button">MP4</button>
    </div>

    <div class="label" style="margin-top:14px;">
      품질
      <span id="quality-hint" class="hint">MP3 음질</span>
    </div>

    <select id="quality"></select>
  </section>

  <section id="video-info" class="card hidden">
    <div id="video-title" class="video-title"></div>
    <div id="video-meta" class="hint"></div>
  </section>

  <button id="download-btn" class="primary" type="button">다운로드</button>
  <button id="cancel-btn" class="secondary" type="button" disabled>취소</button>

  <div class="progress-wrap">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <p id="status" class="status">대기 중</p>

  <section class="card diagnose-card">
    <div class="row between">
      <div>
        <div class="label">서버 진단</div>
        <div class="hint">상세 진단은 별도 페이지에서 확인</div>
      </div>
      <a class="ghost" href="diagnostic.html" style="text-decoration:none;">진단 페이지</a>
    </div>
  </section>

  <footer class="footer">
    개인용 · 본인이 소유하거나 다운로드 권한이 있는 콘텐츠에만 사용하세요.
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
