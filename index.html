<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>YouTube Downloader</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"></head><body><main class="wrap"><section class="card"><h1>YouTube Downloader</h1><p class="sub">개인용 · 광고 없음 · MP3 / M4A / MP4</p><label for="url">YouTube 주소</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..."><div class="row"><div><label>형식</label><div class="seg"><label><input type="radio" name="format" value="mp3" checked> MP3</label><label><input type="radio" name="format" value="m4a"> M4A</label><label><input type="radio" name="format" value="mp4"> MP4</label></div></div><div><label for="quality">품질</label><select id="quality"></select></div></div><button id="downloadBtn" class="primary">다운로드</button><button id="cancelBtn" class="danger" disabled>취소</button><div class="progressWrap"><div class="progress"><div id="bar"></div></div><div class="status" id="status">대기 중</div></div><div class="hint">브라우저의 다운로드 권한과 기기 저장 정책에 따라 저장 위치가 달라질 수 있습니다.</div></section><footer>다운로드 권한이 있는 콘텐츠만 사용하세요.</footer></main><script src="./app.js"></script></body></html>
